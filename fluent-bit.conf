[SERVICE]
    Flush           2
    Daemon          Off
    Log_Level       info
    Mem_Buf_Limit   20M

# =====================================================================
# 1. Inputs Section: High-Frequency Telemetry Data Collection
# =====================================================================
# Collects core system metrics at a aggressive 2-second sampling rate.
[INPUT]
    Name            cpu
    Tag             guest.cpu
    Interval_Sec    2

[INPUT]
    Name            mem
    Tag             guest.memory
    Interval_Sec    2

[INPUT]
    Name            netif
    Tag             guest.net
    Interval_Sec    2
#    Interface       eth0
    Interface       ens3

[INPUT]
    Name            disk
    Tag             guest.disk
    Interval_Sec    2

# =====================================================================
# 2. Filters Section: Metadata Enrichment & Data Transformation
# =====================================================================

# Enrichment: Injects infrastructure context into the telemetry stream.
# Dynamically resolves and appends the cloud instance and project identity 
# from the system environment variables.
[FILTER]
    Name            record_modifier
    Match           *
    Record          resource_id ${INSTANCE_ID}
    Record          project_id ${PROJECT_ID}

# Standardization: Executes a lightweight Lua engine embedded in Fluent Bit.
# Invokes an external script to restructure and normalize the collected records 
# to comply with the unified CRMS (Cloud Resource Management System) schema.
[FILTER]
    Name            lua
    Match           *
    script          normalize.lua
    call            format_to_crms_schema

# =====================================================================
# 3. Outputs Section: Local Debugging & Telemetry Verification
# =====================================================================
# Pipeline Egress: Routes the transformed data straight to the standard output.
# Uses JSON Lines format for real-time visibility, optimal readability, 
# and stream debugging in the console.
[OUTPUT]
    Name            stdout
    Match           *
    Format          json_lines
