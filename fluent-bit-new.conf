# ==============================================================================
# CRMS Agent Configuration (Fluent Bit)
# Architect: crms-team
# Description: A highly restricted, lightweight telemetry agent designed to 
#              prevent observer effect (CPU/Mem overhead) and ensure zero data 
#              loss during network partitions via disk-backed buffering.
# ==============================================================================

[SERVICE]
    # [CRITICAL] Flush interval set to 60 seconds. 
    # Do NOT decrease this value. A 2-second flush will cause severe I/O bottlenecks 
    # and overwhelm the central gateway with microburst traffic.
    Flush           60
    Daemon          Off
    Log_Level       info
    
    # --- Storage & Reliability Engine ---
    # To prevent permanent data loss when the central gateway is unreachable, 
    # we use the filesystem as a persistent buffer instead of volatile memory.
    storage.path    /var/log/crms-agent-buffer
    storage.sync    normal
    storage.checksum off
    # Limits the memory footprint of the backlog queue to prevent Out-Of-Memory (OOM) 
    # inside the guest VM.
    storage.backlog.mem_limit 5M

# ==============================================================================
# Input Plugins: Whitelisted Guest Metrics Only
# Interval_Sec MUST match the Flush interval (60s) to minimize CPU wakeups.
# ==============================================================================
[INPUT]
    Name            cpu
    Tag             guest.cpu
    Interval_Sec    60

[INPUT]
    Name            mem
    Tag             guest.memory
    Interval_Sec    60

[INPUT]
    Name            netif
    Tag             guest.net
    Interval_Sec    60
    Interface       ens3

[INPUT]
    Name            disk
    Tag             guest.disk
    Interval_Sec    60

# ==============================================================================
# Filters: Metadata Injection & Canonical Normalization
# ==============================================================================
[FILTER]
    # Injects the VM's unique identity. These environment variables MUST be 
    # populated by the OpenStack metadata service (169.254.169.254) during boot.
    Name            record_modifier
    Match           *
    Record          resource_id ${INSTANCE_ID}
    Record          project_id ${PROJECT_ID}

[FILTER]
    # Executes the Lua script to strictly enforce the CRMS Canonical Schema.
    # Discards any malformed data before it consumes network bandwidth.
    Name            lua
    Match           *
    script          normalize.lua
    call            format_to_crms_schema

# ==============================================================================
# Output: Stateless Delivery to Gateway
# ==============================================================================
[OUTPUT]
    Name            http
    Match           *
    Host            192.168.0.121
    Port            8080
    URI             /v1/metrics
    Format          json
    Header          Content-Type application/json
    
    # Pre-Shared Key (PSK) authentication to prevent metric spoofing.
    Header          X-Auth-Token crms-secret-token-v1
    
    # --- Resilience Policy ---
    # Retry_Limit is set to False (Infinite Retries).
    # If the gateway is down, the agent will back off and retry indefinitely.
    Retry_Limit     False
    
    # [SAFETY LIMIT] To prevent the agent from consuming the entire VM disk 
    # during a prolonged network outage, the buffer is strictly capped at 100MB.
    # Oldest chunks will be dropped if this limit is reached.
    storage.total_limit_size 100M